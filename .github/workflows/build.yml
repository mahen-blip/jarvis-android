workflow_dispatch:
  push:
    paths:
      - "JarvisAndroid.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Extract Android project archive
        run: |
          test -f JarvisAndroid.zip
          unzip -q JarvisAndroid.zip
          test -f JarvisAndroid/settings.gradle.kts
          test -f JarvisAndroid/app/build.gradle.kts

      - name: Download Gradle 8.9
        run: |
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

      - name: Build debug APK
        working-directory: JarvisAndroid
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-build
          path: |
            JarvisAndroid/app/build/outputs/apk/debug/*.apk
            JarvisAndroid/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
          
